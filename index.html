<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0D2818">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Poker Ranking</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#0D2818;
  --felt2:#122E1D;
  --felt3:#1A3D26;
  --gold:#C9A84C;
  --gold2:#F0CC6A;
  --silver:#A8B4A0;
  --bronze:#B87333;
  --green-bright:#4ADE80;
  --red:#F26B6B;
  --text:#E8F0E4;
  --text-muted:#7A9A7A;
  --card:#16341F;
  --card-border:#1F4A2A;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background:var(--felt);color:var(--text);min-height:100dvh;display:flex;flex-direction:column}

/* TOPBAR */
.topbar{background:var(--felt2);padding:env(safe-area-inset-top,14px) 16px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--card-border)}
.topbar-left{display:flex;flex-direction:column;gap:2px}
.topbar-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;letter-spacing:.5px;color:var(--text)}
.topbar-title span{color:var(--gold)}
.topbar-sub{font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:5px}
.topbar-sub::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green-bright);display:inline-block}
.recorde-badge{background:var(--gold);color:#0D2818;border-radius:8px;padding:5px 10px;display:flex;align-items:center;gap:5px;cursor:pointer}
.recorde-badge-icon{font-size:14px}
.recorde-badge-text{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;line-height:1.2;text-align:right}

/* NAV */
.nav{display:flex;background:var(--felt2);border-bottom:1px solid var(--card-border);padding:0 8px}
.nav-btn{flex:1;padding:11px 4px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border:none;background:transparent;cursor:pointer;color:var(--text-muted);border-bottom:2px solid transparent;transition:all .15s}
.nav-btn.active{color:var(--gold);border-bottom-color:var(--gold)}

/* CONTENT */
.content{flex:1;padding:10px;overflow-y:auto}
.screen{display:none}.screen.active{display:block}

/* LISTA DE RANKING */
.rank-list{background:var(--card);border-radius:var(--radius);border:1px solid var(--card-border);overflow:hidden}
.rank-row{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--card-border)}
.rank-row:last-child{border-bottom:none}
.rank-pos{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;color:var(--text-muted);width:26px;text-align:center;flex-shrink:0}
.rank-pos-1{color:var(--gold2)}.rank-pos-2{color:#C0CFBC}.rank-pos-3{color:#D4934A}
.rank-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;flex-shrink:0;border:2px solid var(--card-border)}
.rank-avatar-1{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0D2818;border-color:var(--gold2);box-shadow:0 0 10px rgba(201,168,76,.35)}
.rank-avatar-2{background:linear-gradient(135deg,#8A9E86,#C0CFBC);color:#0D2818;border-color:#C0CFBC}
.rank-avatar-3{background:linear-gradient(135deg,var(--bronze),#D4934A);color:#0D2818;border-color:#D4934A}
.rank-avatar-n{background:var(--felt3);color:var(--text-muted)}
.rank-info{flex:1;min-width:0}
.rank-name{font-family:'Barlow Condensed',sans-serif;font-size:16px;line-height:1.15;font-weight:700;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-name-1{color:var(--gold2)}
.rank-name-2{color:#C0CFBC}
.rank-name-3{color:#D4934A}
.rank-name-n{color:var(--text)}
.rank-sub{font-size:11px;color:var(--text-muted);margin-top:1px}
.rank-media-pos{color:var(--green-bright)}
.rank-media-neg{color:var(--red)}
.rank-right{display:flex;flex-direction:row;align-items:center;gap:6px;flex-shrink:0}
.rank-pts{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;line-height:1;min-width:34px;text-align:right}
.rank-pts-1{color:var(--gold2)}
.rank-pts-2{color:#C0CFBC}
.rank-pts-3{color:#D4934A}
.rank-pts-n{color:var(--text)}
.trend{font-size:11px;font-weight:700;padding:1px 6px;border-radius:99px;white-space:nowrap}
.trend-up{background:rgba(74,222,128,.15);color:var(--green-bright)}
.trend-down{background:rgba(242,107,107,.15);color:var(--red)}
.trend-same{background:rgba(122,154,122,.12);color:var(--text-muted)}
.extras-badge{background:rgba(201,168,76,.15);color:var(--gold);font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}

/* CARDS GENÉRICOS */
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--card-border);padding:14px;margin-bottom:12px}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}

/* ETAPAS */
.etapa-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--card-border)}
.etapa-row:last-child{border-bottom:none}
.tag{font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600;display:inline-block;margin-top:4px}
.tag-ok{background:rgba(74,222,128,.12);color:var(--green-bright)}
.tag-andamento{background:rgba(201,168,76,.15);color:var(--gold)}

/* DETALHE */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{background:var(--card);border-radius:12px;padding:12px 14px;border:1px solid var(--card-border)}
.stat-label{font-size:11px;color:var(--text-muted);margin-bottom:4px}
.stat-val{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;color:var(--text);line-height:1}
.det-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--card-border)}
.det-row:last-child{border-bottom:none}
.det-pos{font-family:'Barlow Condensed',sans-serif;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.det-pos-1{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0D2818}
.det-pos-2{background:rgba(168,180,160,.25);color:#C0CFBC}
.det-pos-3{background:rgba(184,115,51,.25);color:#D4934A}
.det-pos-n{background:var(--felt3);color:var(--text-muted)}

/* ADMIN */
.andamento-box{background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.25);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--gold);margin-bottom:10px}
.info-box{background:var(--felt3);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--text-muted);margin-bottom:10px;border:1px solid var(--card-border)}

/* BOTÕES */
.btn{width:100%;padding:13px;border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;border:none;transition:opacity .15s;margin-top:8px;display:block}
.btn:active{opacity:.8}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0D2818}
.btn-outline{background:transparent;color:var(--text-muted);border:1px solid var(--card-border)}
.btn-danger{background:transparent;color:var(--red);border:1px solid rgba(242,107,107,.3)}
.btn-sm{width:auto;padding:6px 12px;font-size:13px;border-radius:8px;margin-top:0;display:inline-block}

/* FICHAS / RODADA */
.round-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rtab{padding:5px 13px;border-radius:99px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;border:1px solid var(--card-border);background:transparent;cursor:pointer;color:var(--text-muted)}
.rtab.active{background:var(--gold);color:#0D2818;border-color:var(--gold)}
.rtab.add{border-style:dashed}
.saldo-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:10px;margin-bottom:12px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700}
.saldo-ok{background:rgba(74,222,128,.1);color:var(--green-bright);border:1px solid rgba(74,222,128,.2)}
.saldo-err{background:rgba(242,107,107,.1);color:var(--red);border:1px solid rgba(242,107,107,.2)}
.player-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--card-border)}
.player-row:last-child{border-bottom:none}
.fichas-input{-webkit-appearance:none;appearance:none;width:90px;min-width:90px;height:36px;border:1.5px solid var(--card-border);border-radius:8px;padding:7px 10px;font-size:14px;text-align:center;background:var(--felt3);color:var(--text);font-weight:600;display:block}
.fichas-input.pos{border-color:var(--green-bright);background:rgba(74,222,128,.1);color:var(--green-bright)}
.fichas-input.neg{border-color:var(--red);background:rgba(242,107,107,.1);color:var(--red)}
.fichas-input.zero{border-color:var(--card-border);background:var(--felt3);color:var(--text-muted)}
.fichas-label{font-size:10px;color:var(--text-muted);margin-top:2px;text-align:right}
.fichas-wrap{display:flex;flex-direction:column;align-items:flex-end}
.fichas-linha{display:flex;align-items:center;gap:6px}
.btn-sinal{width:38px;height:36px;border-radius:8px;border:1.5px solid var(--card-border);background:var(--felt3);color:var(--text);font-size:18px;font-weight:700;cursor:pointer;flex-shrink:0}
.btn-sinal:active{opacity:.7}

/* SELEÇÃO */
.check-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--card-border);cursor:pointer;user-select:none}
.check-row:last-child{border-bottom:none}
.check-box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--card-border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;transition:all .15s}
.check-box.checked{background:var(--gold);border-color:var(--gold);color:#0D2818}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.section-title{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px}

/* PIN */
.pin-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}
.pin-overlay.open{display:flex}
.pin-box{background:var(--card);border:1px solid var(--card-border);border-radius:20px;padding:28px 24px;width:300px;text-align:center}
.pin-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;margin-bottom:4px;color:var(--text)}
.pin-sub{font-size:13px;color:var(--text-muted);margin-bottom:20px}
.pin-input{width:100%;border:1px solid var(--card-border);border-radius:10px;padding:12px;font-size:20px;text-align:center;letter-spacing:8px;margin-bottom:14px;background:var(--felt3);color:var(--text)}
.pin-err{font-size:13px;color:var(--red);margin-bottom:10px;min-height:18px}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal-box{background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px 32px;width:100%;max-height:70vh;overflow-y:auto;border-top:1px solid var(--card-border)}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;margin-bottom:12px;color:var(--text)}

/* UTILITÁRIOS */
.loader{text-align:center;padding:32px;color:var(--text-muted);font-size:14px}
.empty{text-align:center;padding:32px 16px;color:var(--text-muted);font-size:14px}
select{width:100%;padding:9px 12px;border:1px solid var(--card-border);border-radius:8px;font-size:14px;background:var(--felt3);color:var(--text);margin-bottom:10px}
.field-label{font-size:13px;color:var(--text-muted);display:block;margin-bottom:4px}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;flex-shrink:0;background:var(--felt3);color:var(--text-muted);border:1px solid var(--card-border)}
.badge-gold{background:rgba(201,168,76,.15);color:var(--gold);font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;display:inline-flex;align-items:center}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.sync-status{font-size:11px;color:var(--text-muted)}
.sync-status.erro{color:var(--red);font-weight:600}
.sync-status.ok{color:var(--green-bright)}
.btn:disabled{opacity:.5;cursor:default}

</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-title"><span>APT</span> Poker Ranking</div>
    <div class="topbar-sub" id="etapa-label">Carregando...</div>
  </div>
  <div id="recorde-bar" style="display:none" onclick="mostrarRecorde()">
    <div class="recorde-badge">
      <div class="recorde-badge-icon">🏆</div>
      <div class="recorde-badge-text" id="recorde-display">—</div>
    </div>
  </div>
</div>

<div class="nav">
  <button class="nav-btn active" onclick="showScreen('ranking')">Ranking</button>
  <button class="nav-btn" onclick="carregarEtapas();showScreen('etapas')">Etapas</button>
  <button class="nav-btn" onclick="carregarAdminPublico()">Admin</button>
</div>

<div class="content">

  <!-- RANKING -->
  <div id="s-ranking" class="screen active">
    <div id="rank-list-wrap" class="rank-list"></div>
  </div>

  <!-- ETAPAS -->
  <div id="s-etapas" class="screen">
    <div class="card"><div id="etapas-list"><div class="loader">Carregando...</div></div></div>
  </div>

  <!-- DETALHE -->
  <div id="s-detalhe" class="screen">
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Rodadas</div><div class="stat-val" id="det-rodadas">—</div></div>
      <div class="stat-card"><div class="stat-label">Participantes</div><div class="stat-val" id="det-jogadores">—</div></div>
    </div>
    <div class="card"><div class="card-title" id="det-titulo"></div><div id="det-lista"></div></div>
    <div id="det-extra" style="margin-bottom:8px"></div>
    <button class="btn btn-outline" onclick="showScreen('etapas')">← Voltar</button>
  </div>

  <!-- ADMIN -->
  <div id="s-admin" class="screen">
    <div id="andamento-aviso" style="display:none" class="andamento-box">
      ⚠️ Etapa em andamento: <strong id="andamento-label"></strong><br>
      <span id="andamento-info"></span>
    </div>
    <div class="card">
      <div class="card-title">Nova etapa</div>
      <label class="field-label">Data da etapa</label>
      <select id="sel-data"></select>
      <button class="btn btn-gold" onclick="acaoComPin(irParaSelecaoJogadores)">Selecionar jogadores →</button>
      <button id="btn-retomar" class="btn btn-outline" style="display:none" onclick="acaoComPin(retomarAndamento)">Retomar etapa em andamento</button>
      <button id="btn-descartar" class="btn btn-danger" style="display:none" onclick="acaoComPin(descartarAndamento)">Descartar etapa em andamento</button>
      <button class="btn btn-outline" style="margin-top:16px" onclick="sairAdmin()">Sair do modo admin</button>
    </div>
  </div>

  <!-- SELEÇÃO -->
  <div id="s-selecao" class="screen">
    <div class="card">
      <div class="section-header">
        <div class="section-title">Participantes da etapa</div>
        <button class="btn btn-outline btn-sm" onclick="addNovoJogadorSelecao()">+ Novo</button>
      </div>
      <div id="lista-selecao"></div>
    </div>
    <button class="btn btn-gold" onclick="confirmarSelecao()">Iniciar rodadas →</button>
    <button class="btn btn-outline" onclick="showScreen('admin')">Voltar</button>
  </div>

  <!-- RODADA -->
  <div id="s-rodada" class="screen">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div style="font-size:13px;color:var(--text-muted)" id="rodada-titulo"></div><div id="sync-status" class="sync-status"></div></div>
    <div class="round-tabs" id="round-tabs"></div>
    <div id="saldo-bar" class="saldo-bar saldo-ok">Total: 0 ✓</div>
    <div class="card">
      <div class="section-header">
        <div class="section-title">Fichas por jogador</div>
        <button class="btn btn-outline btn-sm" onclick="abrirModalJogadores()">+ Jogador</button>
      </div>
      <div id="jogadores-rodada"></div>
    </div>
    <button class="btn btn-gold" onclick="finalizarRodada()">Próxima rodada →</button>
    <button class="btn btn-outline" onclick="verResultado()">Ver resultado da etapa</button>
    <button class="btn btn-danger" onclick="cancelarEtapa()">Cancelar etapa</button>
  </div>

  <!-- RESULTADO -->
  <div id="s-resultado" class="screen">
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Rodadas</div><div class="stat-val" id="res-rodadas">0</div></div>
      <div class="stat-card"><div class="stat-label">Participantes</div><div class="stat-val" id="res-jogadores">0</div></div>
    </div>
    <div class="card"><div class="card-title" id="res-titulo"></div><div id="resultado-list"></div></div>
    <div id="extra-resultado" style="margin-bottom:8px"></div>
    <button class="btn btn-gold" onclick="confirmarFinalizacao()">Finalizar etapa e salvar no ranking</button>
    <button class="btn btn-outline" onclick="showScreen('rodada')">Voltar às rodadas</button>
  </div>

</div>

<!-- PIN -->
<div class="pin-overlay" id="pin-overlay">
  <div class="pin-box">
    <div class="pin-title">🔐 Modo Admin</div>
    <div class="pin-sub">Digite o PIN para continuar</div>
    <input class="pin-input" type="password" inputmode="numeric" maxlength="6" id="pin-input" placeholder="••••">
    <div class="pin-err" id="pin-err"></div>
    <button class="btn btn-gold" onclick="verificarPin()" style="margin-top:0">Entrar</button>
    <button class="btn btn-outline" onclick="fecharPin()">Cancelar</button>
  </div>
</div>

<!-- MODAL CONFIRMAR -->
<div class="modal-overlay" id="modal-confirm">
  <div class="modal-box" style="border-radius:20px;padding:24px 20px 20px">
    <div class="modal-title" id="confirm-msg" style="font-size:16px;margin-bottom:20px;font-weight:600;font-family:'Inter',sans-serif;white-space:pre-line"></div>
    <button class="btn btn-danger" id="confirm-ok">Confirmar</button>
    <button class="btn btn-outline" onclick="fecharConfirm()">Cancelar</button>
  </div>
</div>

<!-- MODAL ALERTA -->
<div class="modal-overlay" id="modal-alert">
  <div class="modal-box" style="border-radius:20px;padding:24px 20px 20px">
    <div class="modal-title" id="alert-msg" style="font-size:16px;margin-bottom:20px;font-weight:600;font-family:'Inter',sans-serif"></div>
    <button class="btn btn-gold" onclick="fecharAlert()">OK</button>
  </div>
</div>
<div class="modal-overlay" id="modal-jogadores">
  <div class="modal-box">
    <div class="modal-title">Adicionar jogador</div>
    <div id="modal-lista"></div>
    <button class="btn btn-outline" style="margin-top:12px" onclick="fecharModal()">Fechar</button>
  </div>
</div>


<script>
var API_URL   = "https://script.google.com/macros/s/AKfycbyZ2kM5CAwPktGTe7ANp2fdBlagQJfwNDDB4VyCla8_UH7hfaSN-BrBuxT4H7ZPcUulfw/exec";

var TODAS_ETAPAS=["10/jan","30/jan","20/fev","28/fev","13/mar","27/mar","10/abr","24/abr","08/mai","29/mai","12/jun","28/jun","10/jul","31/jul","14/ago","28/ago","11/set","25/set","16/out","30/out","13/nov","27/nov","11/dez"];
var PONTOS=[25,18,15,12,10,8,6,4,2];
function getPontos(pos){ return pos<=PONTOS.length?PONTOS[pos-1]:1; }

var adminPin=lerPin();
var isAdmin=!!adminPin;
function lerPin(){ try{ return sessionStorage.getItem('pokerPin')||''; }catch(e){ return ''; } }
function gravarPin(p){ try{ if(p) sessionStorage.setItem('pokerPin',p); else sessionStorage.removeItem('pokerPin'); sessionStorage.removeItem('pokerAdmin'); }catch(e){} }
var rodadaAtual=0, jogadoresCadastrados=[];
var etapaAtual=novaEtapa();
var recordeAtual={fichas:0,jogador:"",etapa:""}, recordeCarregado=false;
var etapasAndamento=[];
var acaoPendente=null;
var BACKUP_KEY='pokerRascunhoBackup';

function novaEtapa(){ return {data:"",rodadas:[],jogadoresSelecionados:[],atualizadoEm:0}; }

// ── UTILITÁRIOS ───────────────────────────────
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function iniciais(n){ return esc(String(n||'').substring(0,2).toUpperCase()); }
function fmt(n){ return Number(n||0).toLocaleString('pt-BR'); }
function normNome(s){ return String(s==null?'':s).trim().replace(/\s+/g,' ').toUpperCase(); }

function lerResposta(r){
  if(!r.ok) throw new Error('Servidor respondeu '+r.status);
  return r.json().then(function(d){
    if(d&&(d.erro||d.ok===false)){ var e=new Error(d.erro||'Erro no servidor'); e.dados=d; throw e; }
    return d;
  });
}
function apiGet(acao,params){
  var q='?acao='+encodeURIComponent(acao);
  if(params) Object.keys(params).forEach(function(k){ q+='&'+k+'='+encodeURIComponent(params[k]); });
  return fetch(API_URL+q).then(lerResposta);
}
// Sem mode:'no-cors' → o app lê a resposta e sabe se realmente salvou.
function apiPost(body){
  body.pin=adminPin;
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
    .then(lerResposta)
    .catch(function(e){
      if(e.dados&&e.dados.pinInvalido&&body.acao!=='verificarPin'){ isAdmin=false; adminPin=''; gravarPin(''); }
      throw e;
    });
}

// ── REGRAS (espelho do Apps Script) ───────────
function limparRodadas(rodadas){
  return (rodadas||[]).map(function(rod){
    return (rod||[]).map(function(j){ return {nome:normNome(j.nome),fichas:Number(j.fichas)||0}; }).filter(function(j){ return j.nome; });
  }).filter(function(rod){ return rod.some(function(j){ return j.fichas!==0; }); });
}
function pontuarEtapa(rodadas){
  var saldos={}, ordem=[], stackVal=null;
  rodadas.forEach(function(rod){ rod.forEach(function(j){
    if(!(j.nome in saldos)){ saldos[j.nome]=0; ordem.push(j.nome); }
    saldos[j.nome]+=j.fichas;
    if(stackVal===null||j.fichas>stackVal) stackVal=j.fichas;
  }); });
  var stack={};
  if(stackVal!==null&&stackVal>0) rodadas.forEach(function(rod){ rod.forEach(function(j){ if(j.fichas===stackVal) stack[j.nome]=true; }); });
  var lista=ordem.map(function(n){ return {nome:n,fichas:saldos[n]}; }).sort(function(a,b){ return b.fichas-a.fichas; });
  lista.forEach(function(j){
    j.pos=1+lista.filter(function(o){ return o.fichas>j.fichas; }).length;
    j.stack=!!stack[j.nome];
    j.pts=getPontos(j.pos)+(j.stack?1:0);
  });
  return {ranking:lista,maiorStack:{valor:stackVal||0,nomes:Object.keys(stack)}};
}

window.onload=function(){ carregarInicio(); };

function showScreen(id){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById('s-'+id).classList.add('active');
  var map={ranking:0,etapas:1};
  if(map[id]!==undefined) document.querySelectorAll('.nav-btn')[map[id]].classList.add('active');
  if(['admin','selecao','rodada','resultado'].indexOf(id)>-1) document.querySelectorAll('.nav-btn')[2].classList.add('active');
}

// ── INÍCIO / RANKING ──────────────────────────
function carregarInicio(){
  apiGet('inicio').then(function(d){
    var ef=((d.ranking&&d.ranking.etapas)||[]).length;
    document.getElementById('etapa-label').textContent=ef+' etapas realizadas em 2026';
    aplicarRecorde(d.recorde);
    renderRanking((d.ranking&&d.ranking.jogadores)||[]);
    renderEtapas(d.etapas||[]);
  }).catch(function(){
    document.getElementById('rank-list-wrap').innerHTML='<div class="empty">Sem conexão.</div>';
    document.getElementById('etapa-label').textContent='Offline';
  });
}

function aplicarRecorde(rec){
  if(!rec) return;
  recordeCarregado=true;
  recordeAtual={fichas:Number(rec.fichas)||0,jogador:rec.jogador||"",etapa:rec.etapa||""};
  if(recordeAtual.jogador){
    document.getElementById('recorde-display').innerHTML='RECORDE ANUAL<br>'+fmt(recordeAtual.fichas)+' ('+esc(recordeAtual.jogador)+')';
    document.getElementById('recorde-bar').style.display='block';
  }
}

function mostrarRecorde(){
  abrirAlert('🏆 Recorde anual: '+fmt(recordeAtual.fichas)+' fichas ('+recordeAtual.jogador+(recordeAtual.etapa?', '+recordeAtual.etapa:'')+')');
}

function renderRanking(lista){
  var wrap=document.getElementById('rank-list-wrap');
  if(!lista.length){ wrap.innerHTML='<div class="empty">Nenhum dado.</div>'; return; }
  wrap.innerHTML=lista.map(function(j,i){
    var pos=j.classif||i+1; // posição da planilha (empates dividem a posição)
    var sufixo=pos<=3?String(pos):'n';
    var media=j.mediaFichas||0;
    var mediaCor=media>0?'rank-media-pos':media<0?'rank-media-neg':'';
    var trendHTML='';
    if(j.posAnterior){
      var diff=j.posAnterior-pos;
      if(diff>0) trendHTML='<span class="trend trend-up">▲ '+diff+'</span>';
      else if(diff<0) trendHTML='<span class="trend trend-down">▼ '+Math.abs(diff)+'</span>';
    }
    return '<div class="rank-row">'+
      '<div class="rank-pos rank-pos-'+sufixo+'">'+(pos===1?'👑':pos+'º')+'</div>'+
      '<div class="rank-info">'+
        '<div class="rank-name rank-name-'+sufixo+'">'+esc(j.nome)+'</div>'+
        '<div class="rank-sub">'+j.jogos+' etapas · média <span class="'+mediaCor+'">'+(media>0?'+':'')+fmt(media)+'</span></div>'+
      '</div>'+
      '<div class="rank-right">'+trendHTML+'<div class="rank-pts rank-pts-'+sufixo+'">'+j.total+'</div></div>'+
    '</div>';
  }).join('');
}

// ── ETAPAS ────────────────────────────────────
function carregarEtapas(){
  apiGet('etapas').then(function(d){ renderEtapas(d.etapas||[]); })
    .catch(function(){ document.getElementById('etapas-list').innerHTML='<div class="empty">Sem conexão.</div>'; });
}

function renderEtapas(lista){
  lista=lista.slice().sort(function(a,b){ return TODAS_ETAPAS.indexOf(b.data)-TODAS_ETAPAS.indexOf(a.data); });
  etapasAndamento=lista.filter(function(e){ return e.status==='Em andamento'; });
  var el=document.getElementById('etapas-list');
  if(!lista.length){ el.innerHTML='<div class="empty">Nenhuma etapa registrada.</div>'; return; }
  el.innerHTML=lista.map(function(e){
    var isA=e.status==='Em andamento';
    return '<div class="etapa-row"><div style="flex:1">'+
      '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:15px;font-weight:700;letter-spacing:.3px">'+esc(e.data)+'</div>'+
      '<div style="font-size:12px;color:var(--text-muted)">'+e.jogadores+' jogadores</div>'+
      '<span class="tag '+(isA?'tag-andamento':'tag-ok')+'">'+esc(e.status)+'</span></div>'+
      '<div style="margin-left:8px"><button class="btn btn-outline btn-sm" data-data="'+esc(e.data)+'" data-tipo="'+(isA?'andamento':'finalizada')+'" onclick="abrirDetalhe(this.dataset.data,this.dataset.tipo)">Ver</button></div></div>';
  }).join('');
}

// ── DETALHE ───────────────────────────────────
function abrirDetalhe(data,tipo){
  document.getElementById('det-titulo').textContent=(tipo==='andamento'?'Em andamento — ':'Pontuação — ')+data;
  document.getElementById('det-lista').innerHTML='<div class="loader">Carregando...</div>';
  document.getElementById('det-extra').innerHTML='';
  document.getElementById('det-rodadas').textContent='—';
  document.getElementById('det-jogadores').textContent='—';
  showScreen('detalhe');
  var erro=function(){ document.getElementById('det-lista').innerHTML='<div class="empty">Erro ao carregar.</div>'; };
  if(tipo==='finalizada'){
    apiGet('detalheEtapa',{data:data}).then(function(d){ renderDetalhe(d,false); }).catch(erro);
  } else {
    apiGet('rascunhos').then(function(d){
      var found=(d.rascunhos||[]).find(function(r){ return r.data===data; });
      if(!found||!found.dados){ document.getElementById('det-lista').innerHTML='<div class="empty">Dados não encontrados.</div>'; return; }
      var rods=limparRodadas(found.dados.rodadas);
      var res=pontuarEtapa(rods);
      renderDetalhe({rodadas:rods.length,ranking:res.ranking,maiorStack:res.maiorStack},true);
    }).catch(erro);
  }
}

function linhasPontuacao(ranking){
  return ranking.map(function(j){
    var pc=j.pos<=3?'det-pos-'+j.pos:'det-pos-n';
    var sinal=j.fichas>0?'+':'';
    var stackBadge=j.stack?'<span class="badge-gold" style="margin-right:6px">+1</span>':'';
    return '<div class="det-row"><div class="det-pos '+pc+'">'+j.pos+'</div>'+
      '<div style="flex:1"><div style="font-family:\'Barlow Condensed\',sans-serif;font-size:15px;font-weight:700">'+esc(j.nome)+'</div>'+
      '<div style="font-size:11px;color:var(--text-muted)">saldo: '+sinal+fmt(j.fichas)+' fichas</div></div>'+
      stackBadge+'<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:18px;font-weight:800;color:var(--gold)">'+j.pts+'</div></div>';
  }).join('');
}

function textoStack(ms){
  if(!ms||!ms.nomes||!ms.nomes.length) return '';
  return 'Maior stack: <strong style="color:var(--text)">'+ms.nomes.map(esc).join(', ')+'</strong> com '+fmt(ms.valor)+' fichas (+1 pt)';
}

function renderDetalhe(d,parcial){
  var ranking=d.ranking||[];
  document.getElementById('det-rodadas').textContent=d.rodadas;
  document.getElementById('det-jogadores').textContent=ranking.length;
  document.getElementById('det-lista').innerHTML=ranking.length?linhasPontuacao(ranking):'<div class="empty">Sem dados no histórico.</div>';
  var t=textoStack(d.maiorStack);
  if(t||parcial) document.getElementById('det-extra').innerHTML='<div class="info-box">'+(parcial?'Resultado parcial · ':'')+t+'</div>';
}

// ── PIN / ADMIN ───────────────────────────────
function carregarAdminPublico(){ carregarJogadores(); carregarAdmin(); }

function acaoComPin(fn){
  if(isAdmin){ fn(); return; }
  acaoPendente=fn; pedirPin();
}
function pedirPin(){
  document.getElementById('pin-overlay').classList.add('open');
  document.getElementById('pin-input').value='';
  document.getElementById('pin-err').textContent='';
  setTimeout(function(){ document.getElementById('pin-input').focus(); },100);
}
function fecharPin(){ document.getElementById('pin-overlay').classList.remove('open'); acaoPendente=null; }
function verificarPin(){
  var pin=document.getElementById('pin-input').value.trim();
  if(!pin){ document.getElementById('pin-err').textContent='Digite o PIN.'; return; }
  var btn=document.querySelector('#pin-overlay .btn-gold');
  btn.disabled=true; btn.textContent='Conferindo...';
  document.getElementById('pin-err').textContent='';
  adminPin=pin;
  apiPost({acao:'verificarPin'}).then(function(){
    isAdmin=true; gravarPin(pin);
    document.getElementById('pin-overlay').classList.remove('open');
    carregarJogadores();
    var fn=acaoPendente; acaoPendente=null;
    if(fn) fn(); else carregarAdmin();
  }).catch(function(e){
    adminPin=''; isAdmin=false;
    document.getElementById('pin-err').textContent=(e.dados&&e.dados.erro)||'Sem conexão. Tente novamente.';
    document.getElementById('pin-input').value='';
  }).then(function(){ btn.disabled=false; btn.textContent='Entrar'; });
}
document.getElementById('pin-input').addEventListener('keydown',function(e){ if(e.key==='Enter') verificarPin(); });
function sairAdmin(){ isAdmin=false; adminPin=''; gravarPin(''); showScreen('ranking'); }

function carregarJogadores(){
  apiGet('jogadores').then(function(d){ jogadoresCadastrados=d.jogadores||[]; }).catch(function(){});
}

function carregarAdmin(){
  Promise.all([
    apiGet('recorde').catch(function(){ return null; }),
    apiGet('etapas').catch(function(){ return {etapas:[]}; })
  ]).then(function(results){
    aplicarRecorde(results[0]);
    var lista=results[1].etapas||[];
    renderEtapas(lista);
    var finalizadas=lista.filter(function(e){ return e.status==='Finalizada'; }).map(function(e){ return e.data; });
    var show=etapasAndamento.length>0;
    if(show){
      var ea=etapasAndamento[0];
      document.getElementById('andamento-label').textContent=ea.data;
      document.getElementById('andamento-info').textContent=ea.rodadas+' rodada(s) · '+ea.jogadores+' jogadores';
    }
    ['andamento-aviso','btn-retomar','btn-descartar'].forEach(function(id){ document.getElementById(id).style.display=show?'block':'none'; });
    var sel=document.getElementById('sel-data');
    sel.innerHTML=TODAS_ETAPAS.map(function(d){ return '<option value="'+d+'">'+d+(finalizadas.indexOf(d)>-1?' ✓':'')+'</option>'; }).join('');
    var proxima=TODAS_ETAPAS.find(function(d){ return finalizadas.indexOf(d)===-1; });
    if(proxima) sel.value=proxima;
    showScreen('admin');
  });
}

// ── AUTOSAVE DO RASCUNHO (fila: nunca perde a última alteração) ──
var sync={emVoo:false,pendente:false,bloqueado:false,timer:null};

function marcarAlteracao(){ etapaAtual.atualizadoEm=Date.now(); backupLocal(); }

function backupLocal(){
  try{ localStorage.setItem(BACKUP_KEY,JSON.stringify(etapaAtual)); }catch(e){}
}
function lerBackup(data){
  try{ var b=JSON.parse(localStorage.getItem(BACKUP_KEY)||'null'); return (b&&b.data===data)?b:null; }catch(e){ return null; }
}
function limparBackup(){ try{ localStorage.removeItem(BACKUP_KEY); }catch(e){} }

function setStatusSync(estado){
  var el=document.getElementById('sync-status');
  var txt={salvando:'salvando…',ok:'✓ salvo',erro:'⚠ não salvo — confira a conexão'}[estado]||'';
  el.textContent=txt; el.className='sync-status'+(estado==='ok'?' ok':estado==='erro'?' erro':'');
}

function salvarRascunho(imediato){
  if(!etapaAtual.data||sync.bloqueado) return;
  clearTimeout(sync.timer);
  if(!imediato){ sync.timer=setTimeout(function(){ salvarRascunho(true); },1500); return; }
  if(sync.emVoo){ sync.pendente=true; return; }
  sync.emVoo=true; setStatusSync('salvando');
  var copia=JSON.parse(JSON.stringify(etapaAtual));
  apiPost({acao:'salvarRascunho',rascunho:copia})
    .then(function(){ setStatusSync('ok'); })
    .catch(function(e){
      if(e.dados&&e.dados.finalizada){ sync.bloqueado=true; setStatusSync(''); return; }
      setStatusSync('erro');
      if(e.dados&&e.dados.pinInvalido){
        // PIN expirou/inválido: pede de novo e reenvia (o backup local garante que nada se perde)
        acaoComPin(function(){ salvarRascunho(true); });
      }
    })
    .then(function(){
      sync.emVoo=false;
      if(sync.pendente&&!sync.bloqueado){ sync.pendente=false; salvarRascunho(true); }
    });
}

function aguardarSync(){
  return new Promise(function(res){ (function check(){ if(!sync.emVoo) res(); else setTimeout(check,200); })(); });
}

function retomarAndamento(){ if(etapasAndamento.length) continuarAndamento(etapasAndamento[0].data); }
function descartarAndamento(){ if(etapasAndamento.length) deletarAndamento(etapasAndamento[0].data); }

function continuarAndamento(data){
  apiGet('rascunhos').then(function(d){
    var found=(d.rascunhos||[]).find(function(r){ return r.data===data; });
    var servidor=found&&found.dados?found.dados:null;
    var local=lerBackup(data);
    var usarLocal=local&&(!servidor||(local.atualizadoEm||0)>(servidor.atualizadoEm||0));
    var dados=usarLocal?local:servidor;
    if(!dados||!dados.rodadas||!dados.rodadas.length){ abrirAlert('Dados não encontrados.'); return; }
    etapaAtual=dados; etapaAtual.data=data;
    if(!etapaAtual.jogadoresSelecionados) etapaAtual.jogadoresSelecionados=[];
    sync.bloqueado=false;
    rodadaAtual=etapaAtual.rodadas.length-1;
    renderRodada(); showScreen('rodada');
    setStatusSync(usarLocal?'salvando':'ok');
    if(usarLocal) salvarRascunho(true);
  }).catch(function(e){ abrirAlert('Erro ao carregar: '+e.message); });
}

function deletarAndamento(data){
  abrirConfirm('Excluir etapa em andamento ('+data+')?', function(){
    apiPost({acao:'excluirRascunho',data:data})
      .then(function(){ if(lerBackup(data)) limparBackup(); carregarAdmin(); })
      .catch(function(e){ abrirAlert('Erro ao excluir: '+e.message); });
  });
}

// ── SELEÇÃO ───────────────────────────────────
function irParaSelecaoJogadores(){
  etapaAtual=novaEtapa();
  etapaAtual.data=document.getElementById('sel-data').value;
  sync.bloqueado=false;
  rodadaAtual=0; renderSelecao(); showScreen('selecao');
}
function renderSelecao(){
  document.getElementById('lista-selecao').innerHTML=jogadoresCadastrados.map(function(n){
    var checked=etapaAtual.jogadoresSelecionados.indexOf(n)>-1;
    return '<div class="check-row" data-nome="'+esc(n)+'" onclick="toggleJogador(this)">'+
      '<div class="check-box'+(checked?' checked':'')+'">'+(checked?'✓':'')+'</div>'+
      '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:15px;font-weight:700">'+esc(n)+'</div></div>';
  }).join('');
}
function toggleJogador(row){
  var nome=row.dataset.nome, box=row.querySelector('.check-box'), idx=etapaAtual.jogadoresSelecionados.indexOf(nome);
  if(idx===-1){ etapaAtual.jogadoresSelecionados.push(nome); box.classList.add('checked'); box.textContent='✓'; }
  else { etapaAtual.jogadoresSelecionados.splice(idx,1); box.classList.remove('checked'); box.textContent=''; }
}
function pedirNomeNovo(){
  var nome=normNome(prompt("Nome do novo jogador:")||'');
  return nome||null;
}
function addNovoJogadorSelecao(){
  var nome=pedirNomeNovo(); if(!nome) return;
  if(jogadoresCadastrados.indexOf(nome)===-1) jogadoresCadastrados.push(nome);
  if(etapaAtual.jogadoresSelecionados.indexOf(nome)===-1) etapaAtual.jogadoresSelecionados.push(nome);
  renderSelecao();
}
function confirmarSelecao(){
  if(etapaAtual.jogadoresSelecionados.length<2){ abrirAlert('Selecione ao menos 2 jogadores.'); return; }
  etapaAtual.rodadas=[etapaAtual.jogadoresSelecionados.map(function(n){ return {nome:n,fichas:0}; })];
  rodadaAtual=0; marcarAlteracao(); salvarRascunho(true); renderRodada(); showScreen('rodada');
}

// ── MODAL JOGADORES ───────────────────────────
function abrirModalJogadores(){
  var naRodada=etapaAtual.rodadas[rodadaAtual].map(function(j){ return j.nome; });
  var disp=jogadoresCadastrados.filter(function(n){ return naRodada.indexOf(n)===-1; });
  document.getElementById('modal-lista').innerHTML=(disp.length?disp.map(function(n){
    return '<div class="check-row" data-nome="'+esc(n)+'" onclick="addJogadorDaLista(this.dataset.nome)">'+
      '<div style="flex:1;font-family:\'Barlow Condensed\',sans-serif;font-size:15px;font-weight:700">'+esc(n)+'</div>'+
      '<span style="font-size:12px;color:var(--text-muted)">+ adicionar</span></div>';
  }).join(''):'<div class="empty">Todos já estão nesta rodada.</div>')+
  '<div style="border-top:1px solid var(--card-border);margin-top:8px;padding-top:8px">'+
  '<button class="btn btn-outline" onclick="addNovoJogadorRodada()">+ Novo jogador</button></div>';
  document.getElementById('modal-jogadores').classList.add('open');
}
function fecharModal(){ document.getElementById('modal-jogadores').classList.remove('open'); }
function addJogadorNaRodada(nome){
  if(etapaAtual.rodadas[rodadaAtual].some(function(j){ return j.nome===nome; })) return;
  etapaAtual.rodadas[rodadaAtual].push({nome:nome,fichas:0});
  if(etapaAtual.jogadoresSelecionados.indexOf(nome)===-1) etapaAtual.jogadoresSelecionados.push(nome);
  marcarAlteracao(); salvarRascunho(true); renderRodada();
}
function addJogadorDaLista(nome){ fecharModal(); addJogadorNaRodada(nome); }
function addNovoJogadorRodada(){
  fecharModal(); var nome=pedirNomeNovo(); if(!nome) return;
  if(jogadoresCadastrados.indexOf(nome)===-1) jogadoresCadastrados.push(nome);
  addJogadorNaRodada(nome);
}

  document.getElementById('alert-msg').textContent=msg;
  document.getElementById('modal-alert').classList.add('open');
  document.getElementById('modal-alert')._cb=fn||null;
}

  var m=document.getElementById('modal-alert'), cb=m._cb;
  m.classList.remove('open'); m._cb=null;
  if(cb) cb();
}

// ── RODADAS ───────────────────────────────────
function renderRodada(){
  document.getElementById('rodada-titulo').textContent='Etapa '+etapaAtual.data;
  document.getElementById('round-tabs').innerHTML=etapaAtual.rodadas.map(function(_,i){
    return '<button class="rtab'+(i===rodadaAtual?' active':'')+'" onclick="trocarRodada('+i+')">'+(i+1)+'ª</button>';
  }).join('')+'<button class="rtab add" onclick="addRodada()">+</button>';
  document.getElementById('jogadores-rodada').innerHTML=etapaAtual.rodadas[rodadaAtual].map(function(j,i){
    var v=j.fichas, cls=v>0?'pos':v<0?'neg':'zero';
    return '<div class="player-row">'+
      '<div style="flex:1;font-family:\'Barlow Condensed\',sans-serif;font-size:15px;font-weight:700">'+esc(j.nome)+'</div>'+
      '<div class="fichas-wrap"><div class="fichas-linha">'+
      '<button class="btn-sinal" type="button" title="Inverter sinal" onclick="inverterSinal('+i+')">±</button>'+
      '<input class="fichas-input '+cls+'" id="ficha-'+i+'" type="text" inputmode="numeric" autocomplete="off" placeholder="—" '+
      (v!==0?'value="'+v+'"':'')+' oninput="atualizarFicha('+i+',this)"></div>'+
      '<div class="fichas-label">fichas · ± p/ negativo</div></div></div>';
  }).join('');
  atualizarSaldo();
}
function lerFichas(txt){
  txt=String(txt||'').replace(/[−–]/g,'-');
  var neg=txt.trim().charAt(0)==='-';
  var dig=txt.replace(/\D/g,'');
  var v=dig?parseInt(dig,10):0;
  return neg?-v:v;
}
function inverterSinal(i){
  var j=etapaAtual.rodadas[rodadaAtual][i];
  var el=document.getElementById('ficha-'+i);
  var v=lerFichas(el.value);
  if(!v){ el.value='-'; el.focus(); return; }   // vazio: já começa com o sinal
  el.value=String(-v);
  atualizarFicha(i,el);
}
function atualizarFicha(i,el){
  var v=lerFichas(el.value);
  etapaAtual.rodadas[rodadaAtual][i].fichas=v;
  el.className='fichas-input '+(v>0?'pos':v<0?'neg':'zero');
  atualizarSaldo();
  marcarAlteracao(); salvarRascunho(false);
}
function atualizarSaldo(){
  var total=etapaAtual.rodadas[rodadaAtual].reduce(function(a,j){ return a+j.fichas; },0);
  var bar=document.getElementById('saldo-bar');
  bar.className='saldo-bar '+(total===0?'saldo-ok':'saldo-err');
  bar.textContent='Total da rodada: '+(total>0?'+':'')+total+(total===0?' ✓':' ✗ (deve ser 0)');
}
function trocarRodada(i){ rodadaAtual=i; renderRodada(); }
function novaRodada(){
  var prev=etapaAtual.rodadas[rodadaAtual];
  etapaAtual.rodadas.push(prev.map(function(j){ return {nome:j.nome,fichas:0}; }));
  rodadaAtual=etapaAtual.rodadas.length-1;
  marcarAlteracao(); salvarRascunho(true); renderRodada();
}
function addRodada(){ novaRodada(); }
function finalizarRodada(){
  var total=etapaAtual.rodadas[rodadaAtual].reduce(function(a,j){ return a+j.fichas; },0);
  if(total!==0){ abrirConfirm('Total da rodada é '+total+' (deveria ser 0). Continuar?', novaRodada); return; }
  novaRodada();
}
function cancelarEtapa(){
  abrirConfirm('Cancelar e descartar esta etapa?', function(){
    sync.bloqueado=true; clearTimeout(sync.timer);
    var data=etapaAtual.data;
    aguardarSync().then(function(){ return apiPost({acao:'excluirRascunho',data:data}); })
      .then(function(){ limparBackup(); etapaAtual=novaEtapa(); carregarAdmin(); })
      .catch(function(e){ sync.bloqueado=false; abrirAlert('Erro ao cancelar: '+e.message); });
  });
}

// ── RESULTADO ─────────────────────────────────
function calcularResultado(){
  var rods=limparRodadas(etapaAtual.rodadas);
  var res=pontuarEtapa(rods);
  var melhor=res.ranking[0];
  // Recorde = maior SALDO na etapa, e só vale se superar o atual.
  var novoRecorde=(recordeCarregado&&melhor&&melhor.fichas>recordeAtual.fichas)?{nome:melhor.nome,fichas:melhor.fichas}:null;
  return {rodadas:rods,ranking:res.ranking,maiorStack:res.maiorStack,novoRecorde:novoRecorde};
}

function verResultado(){
  var mostrar=function(){
    var r=calcularResultado();
    if(!r.rodadas.length){ abrirAlert('Nenhuma rodada com fichas lançadas.'); return; }
    document.getElementById('res-rodadas').textContent=r.rodadas.length;
    document.getElementById('res-jogadores').textContent=r.ranking.length;
    document.getElementById('res-titulo').textContent='Pontuação — '+etapaAtual.data;
    document.getElementById('resultado-list').innerHTML=linhasPontuacao(r.ranking);
    var html='';
    if(r.novoRecorde){
      var n=esc(r.novoRecorde.nome), f=fmt(r.novoRecorde.fichas);
      html='<div class="andamento-box">🏆 '+(r.novoRecorde.nome===recordeAtual.jogador
        ?n+' bateu o próprio recorde com '+f+' fichas! +5 pts mantidos.'
        :'Novo recorde! '+n+' com '+f+' fichas. +5 pts para '+n+(recordeAtual.jogador?', −5 pts de '+esc(recordeAtual.jogador):'')+'.')+'</div>';
    } else if(!recordeCarregado){
      html='<div class="info-box">Recorde anual não carregado — será conferido pelo servidor ao salvar.</div>';
    }
    var t=textoStack(r.maiorStack);
    if(t) html+='<div class="info-box">'+t+'.</div>';
    var somasErradas=r.rodadas.map(function(rod,i){ return {i:i+1,s:rod.reduce(function(a,j){ return a+j.fichas; },0)}; }).filter(function(x){ return x.s!==0; });
    if(somasErradas.length) html+='<div class="andamento-box">⚠️ Rodada(s) que não somam zero: '+somasErradas.map(function(x){ return x.i+'ª ('+(x.s>0?'+':'')+x.s+')'; }).join(', ')+'</div>';
    document.getElementById('extra-resultado').innerHTML=html;
    showScreen('resultado');
  };
  if(recordeCarregado) mostrar();
  else apiGet('recorde').then(aplicarRecorde).catch(function(){}).then(mostrar);
}

function confirmarFinalizacao(){
  var r=calcularResultado();
  if(!r.rodadas.length){ abrirAlert('Nenhuma rodada com fichas lançadas.'); return; }
  var vazias=etapaAtual.rodadas.length-r.rodadas.length;
  abrirConfirm('⚠️ Finalizar a etapa '+etapaAtual.data+'?\n\n'+
    r.rodadas.length+' rodada(s) · '+r.ranking.length+' jogadores'+
    (vazias?'\n('+vazias+' rodada(s) sem fichas serão ignoradas)':'')+
    '\n\nDepois de finalizada, NÃO será possível lançar novas rodadas. Se o jogo ainda não terminou, toque em Cancelar.',
    salvarEtapa,'Sim, finalizar etapa');
}
function salvarEtapa(){
  var r=calcularResultado();
  if(!r.rodadas.length){ abrirAlert('Nenhuma rodada com fichas lançadas.'); return; }
  var btn=document.querySelector('#s-resultado .btn-gold');
  btn.textContent='Salvando...'; btn.disabled=true;
  var data=etapaAtual.data;
  sync.bloqueado=true; clearTimeout(sync.timer); // nenhum autosave depois daqui
  aguardarSync().then(function(){
    return apiPost({acao:'salvarEtapa',data:data,rodadas:r.rodadas});
  }).then(function(resp){
    aplicarRecorde(resp.recorde);
    limparBackup();
    etapaAtual=novaEtapa();
    abrirAlert('Etapa '+data+' salva com sucesso!', function(){ showScreen('ranking'); });
    carregarInicio();
  }).catch(function(e){
    sync.bloqueado=false;
    if(e.dados&&e.dados.pinInvalido){ acaoComPin(salvarEtapa); return; }
    abrirAlert('Erro ao salvar: '+e.message+'. Nada foi perdido — tente novamente.');
  }).then(function(){ btn.textContent='Finalizar etapa e salvar no ranking'; btn.disabled=false; });
}
</script>
